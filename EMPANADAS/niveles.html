<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Niveles</title>
    <link rel="stylesheet" href="css/niveles.css">
</head>

<body>

    <main class="pantalla-niveles">

        <!-- Fondo -->
        <img
            class="fondo-niveles"
            src="img/niveles/fondo-niveles.png"
            alt="Mapa de niveles"
        >

        <!-- Título -->
        <img
            class="titulo-niveles"
            src="img/niveles/elige-nivel.png"
            alt="Elige un nivel"
        >

        <!-- NIVELES -->
        <div class="niveles">

            <!-- NIVEL 1 -->
            <button
                class="nivel nivel-1"
                id="nivel-1"
                type="button"
            >
                <span class="numero-nivel">1</span>

                <span class="estrellas-nivel" id="estrellas-nivel-1">

                    <img
                        class="estrella estrella-1"
                        src="img/estrellas/estrella-apagada.png"
                        alt="Estrella 1"
                    >

                    <img
                        class="estrella estrella-2"
                        src="img/estrellas/estrella-apagada.png"
                        alt="Estrella 2"
                    >

                    <img
                        class="estrella estrella-3"
                        src="img/estrellas/estrella-apagada.png"
                        alt="Estrella 3"
                    >

                </span>
            </button>


            <!-- NIVEL 2 -->
            <button
                class="nivel nivel-2"
                id="nivel-2"
                type="button"
            >
                <span class="numero-nivel">2</span>

                <span class="estrellas-nivel" id="estrellas-nivel-2">

                    <img
                        class="estrella estrella-1"
                        src="img/estrellas/estrella-apagada.png"
                        alt="Estrella 1"
                    >

                    <img
                        class="estrella estrella-2"
                        src="img/estrellas/estrella-apagada.png"
                        alt="Estrella 2"
                    >

                    <img
                        class="estrella estrella-3"
                        src="img/estrellas/estrella-apagada.png"
                        alt="Estrella 3"
                    >

                </span>
            </button>


            <!-- NIVEL 3 -->
            <button
                class="nivel nivel-3"
                id="nivel-3"
                type="button"
            >
                <span class="numero-nivel">3</span>

                <span class="estrellas-nivel" id="estrellas-nivel-3">

                    <img
                        class="estrella estrella-1"
                        src="img/estrellas/estrella-apagada.png"
                        alt="Estrella 1"
                    >

                    <img
                        class="estrella estrella-2"
                        src="img/estrellas/estrella-apagada.png"
                        alt="Estrella 2"
                    >

                    <img
                        class="estrella estrella-3"
                        src="img/estrellas/estrella-apagada.png"
                        alt="Estrella 3"
                    >

                </span>
            </button>


            <!-- NIVEL 4 -->
            <button
                class="nivel nivel-4"
                id="nivel-4"
                type="button"
            >
                <span class="numero-nivel">4</span>

                <span class="estrellas-nivel" id="estrellas-nivel-4">

                    <img
                        class="estrella estrella-1"
                        src="img/estrellas/estrella-apagada.png"
                        alt="Estrella 1"
                    >

                    <img
                        class="estrella estrella-2"
                        src="img/estrellas/estrella-apagada.png"
                        alt="Estrella 2"
                    >

                    <img
                        class="estrella estrella-3"
                        src="img/estrellas/estrella-apagada.png"
                        alt="Estrella 3"
                    >

                </span>
            </button>


            <!-- NIVEL 5 -->
            <button
                class="nivel nivel-5"
                id="nivel-5"
                type="button"
            >
                <span class="numero-nivel">5</span>

                <span class="estrellas-nivel" id="estrellas-nivel-5">

                    <img
                        class="estrella estrella-1"
                        src="img/estrellas/estrella-apagada.png"
                        alt="Estrella 1"
                    >

                    <img
                        class="estrella estrella-2"
                        src="img/estrellas/estrella-apagada.png"
                        alt="Estrella 2"
                    >

                    <img
                        class="estrella estrella-3"
                        src="img/estrellas/estrella-apagada.png
                        alt="Estrella 3"
                    >

                </span>
            </button>

        </div>


        <!-- Botón volver -->
        <button
            class="btn-volver"
            id="btn-volver"
            type="button"
        >
            VOLVER
        </button>

    </main>

    <script src="js/niveles.js"></script>

</body>
</html>
