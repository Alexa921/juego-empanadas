<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Niveles</title>
    <link rel="stylesheet" href="css/niveles.css">
</head>
<body>
    <main class="pantalla-niveles">

        <!-- Fondo -->

        <img
            class="fondo-niveles"
            src="img/niveles/fondo-niveles.png"
            alt="Mapa de niveles"
        >


        <!-- Título -->

        <img 
            class="titulo-niveles"
            src="img/niveles/elige-nivel.png"
            alt="Elige un nivel"
        >


        <!-- NIVELES -->

        <div class="niveles">

            <button class="nivel nivel-1" id="nivel-1">
                1
            </button>

            <button class="nivel nivel-2" id="nivel-2">
                🔒
            </button>

            <button class="nivel nivel-3" id="nivel-3">
                🔒
            </button>

            <button class="nivel nivel-4" id="nivel-4">
                🔒
            </button>

            <button class="nivel nivel-5" id="nivel-5">
                🔒
            </button>

        </div>


        <!-- Botón volver -->

        <button
            class="btn-volver"
            id="btn-volver"
        >
            VOLVER
        </button>

    </main>


    <script src="js/niveles.js"></script>
</body>
</html>
