<!DOCTYPE html>

<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Crear cuenta - Juego de Empanadas</title>

<link rel="stylesheet" href="CSS/registro.css">

</head>

<body>

<main class="pantalla-registro">

    <section class="tarjeta-registro">

        <h1>Crear cuenta</h1>

        <p class="texto-instruccion">
            Crea tu cuenta para guardar tu progreso
        </p>

        <form id="form-registro">

            <div class="grupo-input">
                <label for="username">Usuario</label>

                <input
                    type="text"
                    id="username"
                    name="username"
                    placeholder="Escribe tu usuario"
                    autocomplete="username"
                    minlength="3"
                    required
                >
            </div>

            <div class="grupo-input">
                <label for="password">Contraseña</label>

                <input
                    type="password"
                    id="password"
                    name="password"
                    placeholder="Crea una contraseña"
                    autocomplete="new-password"
                    minlength="6"
                    required
                >
            </div>

            <div class="grupo-input">
                <label for="confirm-password">Confirmar contraseña</label>

                <input
                    type="password"
                    id="confirm-password"
                    name="confirm-password"
                    placeholder="Repite tu contraseña"
                    autocomplete="new-password"
                    minlength="6"
                    required
                >
            </div>

            <p id="mensaje-registro" class="mensaje"></p>

            <button
                type="submit"
                class="boton-principal"
            >
                Registrarse
            </button>

        </form>

        <div class="separador">
            <span>¿Ya tienes una cuenta?</span>
        </div>

        <button
            type="button"
            id="boton-login"
            class="boton-secundario"
        >
            Iniciar sesión
        </button>

    </section>

</main>

<script src="JS/registro.js"></script>

</body>

</html>
